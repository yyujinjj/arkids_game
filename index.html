<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>명절에 생긴 일 — 믿음을 지키고, 가족을 사랑하는 설날 이야기</title>
<!-- 웹폰트는 인터넷이 없어도 게임이 깨지지 않도록 fallback 폰트가 자동 적용됩니다. -->
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   기본 설정
   ========================================================= */
:root{
  --red:#e0524f; --red-dark:#b83a38; --gold:#f5b942; --gold-dark:#d9952a;
  --cream:#fff7e8; --paper:#fffdf8; --brown:#5b3a2e; --ink:#2f2622; --muted:#7a6a62;
  --green:#4caf7d; --blue:#4b8fd8; --pink:#ff8fa3; --purple:#8e6bd9;
  --shadow:0 12px 34px rgba(70,35,10,.22);
  --font-title:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#2a1a16;font-family:var(--font-body);color:var(--ink);word-break:keep-all;overflow-wrap:break-word;line-break:strict}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:4px solid #fff;outline-offset:2px}

/* 가로형 16:9 스테이지 (1280×720 기준, 화면 크기에 맞춰 자동 확대/축소) */
#viewport{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#4a2c24,#1e120f 70%)}
#stage{
  position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform:translate(-50%,-50%) scale(1);transform-origin:center center;
  overflow:hidden;border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.55);
  background:#ffe5b8;
}

/* =========================================================
   상단 HUD (효도 / 말씀 게이지)
   ========================================================= */
#hud{
  position:absolute;top:0;left:0;right:0;height:74px;z-index:50;
  display:flex;align-items:center;justify-content:space-between;padding:0 26px;
  background:linear-gradient(180deg,rgba(60,25,15,.55),rgba(60,25,15,0));
  pointer-events:none;
}
#hud .logo{font-family:var(--font-title);font-size:26px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4);letter-spacing:1px}
#hud .logo small{font-size:15px;opacity:.85;margin-left:8px;font-family:var(--font-body);font-weight:500}
.gauges{display:flex;gap:16px;align-items:center}
.sound{pointer-events:auto;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);font-size:24px;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .12s}
.sound:hover{transform:scale(1.08)}
.sound:active{transform:scale(.94)}
.sound.off{opacity:.6}
.sound-panel{position:absolute;right:26px;top:80px;width:400px;background:rgba(255,253,248,.98);border-radius:22px;padding:16px 20px;box-shadow:var(--shadow);pointer-events:auto;display:flex;flex-direction:column;gap:12px;animation:pop .35s cubic-bezier(.34,1.56,.64,1) both;border:3px solid #ffd7a6}
.sound-panel[hidden]{display:none}
.srow{display:flex;align-items:center;gap:12px}
.slab{font-weight:900;font-size:18px;color:var(--brown);flex:0 0 110px}
.sval{font-weight:900;font-size:16px;color:var(--muted);flex:0 0 32px;text-align:right;font-variant-numeric:tabular-nums}
.sound-panel input[type=range]{flex:1;accent-color:var(--red);height:28px;cursor:pointer}
.srow.off .slab,.srow.off input[type=range],.srow.off .sval{opacity:.4}
.sw{position:relative;flex:0 0 54px;height:30px;cursor:pointer}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw .knob{position:absolute;inset:0;border-radius:999px;background:#d9cbbb;transition:background .2s}
.sw .knob::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+.knob{background:var(--green)}
.sw input:checked+.knob::after{transform:translateX(24px)}
.gauge{
  position:relative;display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.92);border-radius:999px;padding:8px 16px 8px 12px;
  box-shadow:0 6px 18px rgba(0,0,0,.18);min-width:250px;
}
.gauge .lab{font-weight:900;font-size:17px;white-space:nowrap}
.gauge .bar{flex:1;height:16px;border-radius:999px;background:#eadfd2;overflow:hidden;position:relative}
.gauge .fill{height:100%;width:0%;border-radius:999px;transition:width .8s cubic-bezier(.34,1.56,.64,1)}
.gauge.hyo .fill{background:linear-gradient(90deg,#ff7d7a,#e0524f)}
.gauge.word .fill{background:linear-gradient(90deg,#ffd76a,#f5a623)}
.gauge .num{font-weight:900;font-size:15px;color:var(--muted);min-width:34px;text-align:right}
.gauge.bump{animation:bump .6s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.gauge .float{
  position:absolute;right:14px;top:-4px;font-weight:900;font-size:22px;color:var(--red);
  animation:floatUp 1.3s ease forwards;text-shadow:0 2px 6px rgba(255,255,255,.9);
}
.gauge.word .float{color:#d9952a}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-38px)}}

/* =========================================================
   장면 컨테이너 / 전환
   ========================================================= */
#scene{position:absolute;inset:0;opacity:1;transition:opacity .4s ease}
#scene.hidden{opacity:0}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;overflow:hidden}
.dim{position:absolute;inset:0;background:rgba(20,8,5,0);transition:background .8s ease;pointer-events:none;z-index:5}
.dim.on{background:rgba(20,8,5,.55)}

/* ----- CSS 배경 placeholder (이미지가 없을 때) ----- */
.bg-title{background:linear-gradient(180deg,#ffe3a8 0%,#ffbf78 45%,#e87e58 100%)}
.bg-morning{background:linear-gradient(180deg,#bfe4ff 0%,#eaf6ff 55%,#8fb37a 56%,#6f9a5e 100%)}
.bg-arrival{background:linear-gradient(180deg,#f6e2c4 0%,#f1d3a6 60%,#b57a4a 61%,#8f5a33 100%)}
.bg-jesa{background:linear-gradient(180deg,#efd9b6 0%,#e8c99a 60%,#a56a3c 61%,#7d4d2a 100%)}
.bg-after{background:linear-gradient(180deg,#fff2d6 0%,#ffe0b0 60%,#c98a52 61%,#a56a3c 100%)}
.bg-ending{background:linear-gradient(180deg,#ffe8b0 0%,#ffc98a 45%,#ff9a6e 100%)}
.sun{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#fff6c4,#ffd166 70%);box-shadow:0 0 60px 20px rgba(255,215,120,.5);right:120px;top:70px}
.cloud{position:absolute;width:180px;height:60px;background:rgba(255,255,255,.85);border-radius:60px;animation:drift 30s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:80px;height:80px;left:25px;top:-38px}
.cloud::after{width:60px;height:60px;left:90px;top:-25px}
@keyframes drift{from{transform:translateX(-250px)}to{transform:translateX(1500px)}}
.hanok{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);width:640px;opacity:.6}
.hanok .roof{height:90px;background:linear-gradient(180deg,#5d3d2c,#3f281f);border-radius:50% 50% 8px 8px / 100% 100% 8px 8px;box-shadow:0 8px 0 #2f1d16}
.hanok .roof2{width:520px;height:70px;margin:-20px auto 0;background:linear-gradient(180deg,#6f4a36,#4a2f23);border-radius:50% 50% 6px 6px / 100% 100% 6px 6px}
.hanok .body{width:480px;height:130px;margin:0 auto;background:#f4e3c7;border:10px solid #7b5238;border-top:0;display:flex;justify-content:space-around;align-items:flex-end;padding-bottom:0}
.hanok .door{width:110px;height:100px;background:repeating-linear-gradient(90deg,#e7cfa7 0 18px,#9a6a44 18px 22px);border:6px solid #7b5238;border-bottom:0}
.ground{position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(180deg,#c99a63,#a97a48)}
.lantern{position:absolute;font-size:56px;animation:sway 3s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.road{position:absolute;left:0;right:0;bottom:0;height:200px;background:#5c5a62}
.road::before{content:"";position:absolute;left:0;right:0;top:95px;height:10px;background:repeating-linear-gradient(90deg,#fff 0 60px,transparent 60px 120px);animation:roadmove .8s linear infinite}
@keyframes roadmove{from{background-position:0 0}to{background-position:-120px 0}}
.car{position:absolute;bottom:70px;left:120px;font-size:120px;animation:carbob .5s ease-in-out infinite;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35))}
@keyframes carbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mount{position:absolute;bottom:200px;font-size:140px;opacity:.9}
.wall-deco{position:absolute;top:120px;font-size:64px;opacity:.9}
.table{position:absolute;left:50%;transform:translateX(-50%);bottom:110px;width:820px;height:110px;background:linear-gradient(180deg,#8b5a3c,#6a4229);border-radius:14px;box-shadow:0 14px 0 #4c2f1c,0 24px 30px rgba(0,0,0,.35)}
.table .food{position:absolute;left:0;right:0;top:-46px;display:flex;justify-content:space-around;font-size:54px;padding:0 40px}
.confetti{position:absolute;top:-20px;width:14px;height:22px;border-radius:4px;animation:fall linear infinite;opacity:.9}
@keyframes fall{0%{transform:translateY(-40px) rotate(0)}100%{transform:translateY(780px) rotate(720deg)}}

/* =========================================================
   캐릭터 placeholder
   ========================================================= */
.chars{position:absolute;top:96px;left:0;right:0;height:250px;display:flex;justify-content:space-between;padding:0 90px;pointer-events:none;z-index:6}
.char{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:charIn .6s ease forwards}
.char:nth-child(2){animation-delay:.15s}
@keyframes charIn{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
.char .face{
  width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:104px;background:radial-gradient(circle at 30% 25%,#fff,#ffe1bd);
  border:7px solid #fff;box-shadow:var(--shadow);overflow:hidden;
}
.char .face img{width:100%;height:100%;object-fit:cover}
.char .face svg{width:100%;height:100%;display:block}
.char .name{background:var(--brown);color:#fff;font-weight:700;padding:5px 18px;border-radius:999px;font-size:18px}
.char.speaking .face{animation:talk 1s ease-in-out infinite}
@keyframes talk{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.chars.group{justify-content:center;gap:40px}
.chars.group .char .face{width:130px;height:130px;font-size:78px}

/* =========================================================
   말풍선
   ========================================================= */
.dialog{position:absolute;left:40px;right:40px;bottom:100px;top:350px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;z-index:7;cursor:pointer}
.bubble{
  max-width:78%;background:#fff;border-radius:22px;padding:14px 24px;font-size:25px;line-height:1.45;font-weight:500;
  box-shadow:0 8px 22px rgba(60,30,10,.18);position:relative;animation:pop .45s cubic-bezier(.34,1.56,.64,1) both;
}
.bubble .who{display:block;font-size:15px;font-weight:900;color:var(--red);margin-bottom:2px;letter-spacing:.5px}
.bubble.left{align-self:flex-start;border-bottom-left-radius:6px}
.bubble.right{align-self:flex-end;background:#fff1cf;border-bottom-right-radius:6px}
.bubble.right .who{color:#c47d12}
.bubble.narr{align-self:center;background:rgba(50,30,20,.82);color:#fff;font-size:22px;border-radius:14px;padding:10px 24px;font-weight:500}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.85)}to{opacity:1;transform:none}}

/* =========================================================
   버튼
   ========================================================= */
.actions{position:absolute;right:40px;bottom:26px;display:flex;gap:14px;z-index:8}
.btn{
  font-family:var(--font-title);font-size:26px;letter-spacing:1px;padding:14px 36px;border-radius:999px;white-space:nowrap;
  background:linear-gradient(180deg,#ff6f6b,#df4a47);color:#fff;box-shadow:0 8px 0 #a83533,0 14px 24px rgba(0,0,0,.25);
  transition:transform .12s ease,box-shadow .12s ease,filter .2s ease;position:relative;top:0;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-3px);box-shadow:0 11px 0 #a83533,0 18px 28px rgba(0,0,0,.28)}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #a83533,0 6px 12px rgba(0,0,0,.25)}
.btn.gold{background:linear-gradient(180deg,#ffd35a,#f0a52a);box-shadow:0 8px 0 #b7761a,0 14px 24px rgba(0,0,0,.22);color:#4a2e08}
.btn.gold:hover{box-shadow:0 11px 0 #b7761a,0 18px 28px rgba(0,0,0,.25)}
.btn.gold:active{box-shadow:0 2px 0 #b7761a,0 6px 12px rgba(0,0,0,.2)}
.btn.ghost{background:rgba(255,255,255,.9);color:var(--brown);box-shadow:0 6px 0 #c7a88a,0 12px 20px rgba(0,0,0,.15);font-size:22px}
.btn.ghost:hover{box-shadow:0 9px 0 #c7a88a,0 16px 24px rgba(0,0,0,.18)}
.btn.ghost:active{box-shadow:0 1px 0 #c7a88a,0 4px 10px rgba(0,0,0,.15)}
.btn.big{font-size:38px;padding:22px 70px}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.btn.hide{opacity:0;pointer-events:none}
.btn.show{animation:pop .4s ease both}

/* =========================================================
   선택 / 피드백 오버레이
   ========================================================= */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;animation:fadeIn .4s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.overlay.shade{background:rgba(20,8,5,.35)}
.qcard{width:860px;background:rgba(255,253,248,.97);border-radius:32px;padding:34px 40px 36px;box-shadow:var(--shadow);animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;text-align:center}
.qcard h2{font-family:var(--font-title);font-size:40px;color:var(--brown);margin-bottom:22px}
.qcard.important h2{color:var(--red-dark)}
.qcard .tag{display:inline-block;background:var(--red);color:#fff;font-weight:900;font-size:16px;padding:4px 16px;border-radius:999px;margin-bottom:12px;letter-spacing:1px}
.choices{display:flex;flex-direction:column;gap:14px}
.choice{
  display:flex;align-items:center;gap:18px;text-align:left;width:100%;
  border-radius:20px;padding:16px 24px;font-size:26px;font-weight:700;color:var(--ink);
  background:#fff;border:4px solid #eadfd2;box-shadow:0 6px 0 #e3d6c6;
  transition:transform .12s ease,box-shadow .12s ease,border-color .15s,background .15s;
  animation:slideIn .45s ease both;
}
.choice:nth-child(1){animation-delay:.05s}.choice:nth-child(2){animation-delay:.15s}.choice:nth-child(3){animation-delay:.25s}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.choice .key{flex:0 0 52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-size:26px;color:#fff}
.choice.a .key{background:var(--blue)}.choice.b .key{background:var(--purple)}.choice.c .key{background:var(--green)}
.choice:hover{transform:translateY(-3px);border-color:var(--gold);background:#fff9ea;box-shadow:0 9px 0 #e3d6c6}
.choice:active{transform:translateY(5px);box-shadow:0 1px 0 #e3d6c6}

.fcard{width:820px;background:var(--paper);border-radius:32px;padding:38px 44px;box-shadow:var(--shadow);text-align:center;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;position:relative}
.fcard h2{font-family:var(--font-title);font-size:44px;margin-bottom:16px;color:var(--brown)}
.fcard.good h2{color:#d9952a;font-size:54px}
.fcard.hmm h2{color:#7a5b8f}
.fcard p{font-size:25px;line-height:1.6;color:#3f332e;font-weight:500;padding:0 6px}
.fcard .quote{background:#fff1cf;border-radius:18px;padding:16px 22px;margin:0 0 18px;font-size:25px;font-weight:700;color:#5b3a2e;border-left:8px solid var(--gold)}
.fcard .gain{display:flex;justify-content:center;gap:14px;margin:22px 0 4px;flex-wrap:wrap}
.fcard .gain span{background:#fff;border:3px solid #ffd7a6;border-radius:999px;padding:8px 22px;font-weight:900;font-size:22px;animation:pop .5s .3s cubic-bezier(.34,1.56,.64,1) both}
.fcard .gain span:nth-child(2){animation-delay:.5s}
.fcard .btns{display:flex;justify-content:center;gap:14px;margin-top:26px;flex-wrap:wrap}

/* 말씀 카드 */
.versecard{width:940px;background:linear-gradient(160deg,#fffaf0,#fff0d0);border-radius:30px;padding:26px 40px 28px;text-align:center;box-shadow:var(--shadow);border:6px solid #f3d38b;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
.versecard .pastor{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
.versecard .pface{width:96px;height:96px;border-radius:50%;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 20px rgba(80,50,10,.25);background:#dbe8ff;display:flex;align-items:center;justify-content:center;font-size:60px;flex:0 0 96px;animation:pop .5s .1s cubic-bezier(.34,1.56,.64,1) both}
.versecard .pface img{width:100%;height:100%;object-fit:cover;display:block}
.versecard .pbubble{position:relative;background:#fff;border-radius:18px;padding:10px 20px;font-size:21px;font-weight:700;color:#5b3a2e;box-shadow:0 6px 16px rgba(80,50,10,.15);animation:pop .5s .3s cubic-bezier(.34,1.56,.64,1) both}
.versecard .pbubble b{display:block;font-size:14px;color:var(--red);letter-spacing:1px;margin-bottom:2px}
.versecard .pbubble::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);border:8px solid transparent;border-right-color:#fff;border-left:0}
.versecard .verse{font-family:var(--font-title);font-size:24px;line-height:1.6;white-space:nowrap;color:#6b4a13}
.versecard .verse b{display:inline-block;margin-top:6px;color:var(--red-dark);background:rgba(255,230,150,.7);border-radius:8px;padding:0 10px;white-space:nowrap}
.versecard .note{margin-top:16px;background:rgba(255,255,255,.85);border:3px solid #f3d38b;border-radius:16px;padding:12px 18px;font-size:20px;line-height:1.55;font-weight:500;color:#4a3a2a;text-align:left}
.versecard .note b{color:var(--red-dark)}
.versecard .ref{margin-top:10px;font-size:20px;color:var(--muted);font-weight:700}
.minicard{
  position:absolute;left:50%;transform:translateX(-50%);top:110px;z-index:9;
  background:#fff;border-radius:22px;padding:18px 28px;box-shadow:var(--shadow);display:flex;align-items:center;gap:20px;
  animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;border:4px solid #ffd7a6;
}
.minicard p{font-size:23px;font-weight:700;color:var(--brown);white-space:nowrap}

/* 게임 방법 모달 */
.modal{width:700px;background:var(--paper);border-radius:30px;padding:40px 44px;text-align:center;box-shadow:var(--shadow);animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
.modal h2{font-family:var(--font-title);font-size:40px;color:var(--brown);margin-bottom:16px}
.modal p{font-size:25px;line-height:1.7;font-weight:500}

/* =========================================================
   시작 화면
   ========================================================= */
.title-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding-top:10px}
.title-badge{background:var(--red);color:#fff;font-weight:900;padding:6px 22px;border-radius:999px;font-size:18px;letter-spacing:2px;box-shadow:0 6px 16px rgba(0,0,0,.25);animation:pop .5s both}
.title-main{
  font-family:var(--font-title);font-size:112px;color:#fff;margin:8px 0 0;letter-spacing:4px;
  text-shadow:0 6px 0 #b5423f,0 14px 30px rgba(80,20,10,.45);animation:pop .7s .1s cubic-bezier(.34,1.56,.64,1) both;
}
.title-sub{
  font-size:28px;font-weight:700;color:#5b2e22;background:rgba(255,255,255,.85);padding:10px 30px;border-radius:999px;
  margin-top:10px;box-shadow:0 6px 18px rgba(0,0,0,.15);animation:pop .6s .3s both;
}
.name-row{margin-top:26px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.9);padding:10px 14px 10px 20px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.15);animation:pop .6s .45s both}
.name-row label{font-weight:700;font-size:20px;color:var(--brown)}
.name-row input{width:180px;border:3px solid #f3d38b;border-radius:999px;padding:8px 16px;font-size:22px;font-family:inherit;font-weight:700;text-align:center;outline:none;color:var(--ink)}
.name-row input:focus{border-color:var(--red)}
.title-btns{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:14px;animation:pop .6s .6s both}

/* =========================================================
   효도 미션 체크리스트
   ========================================================= */
.mission-wrap{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding-top:60px}
.mission{width:1000px;background:rgba(255,253,248,.97);border-radius:32px;padding:30px 40px 32px;box-shadow:var(--shadow);animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
.mission h2{font-family:var(--font-title);font-size:44px;color:var(--brown);text-align:center;margin-bottom:16px}
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.mitem{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid #eadfd2;border-radius:16px;padding:10px 16px;font-size:21px;font-weight:700;text-align:left;transition:all .15s;animation:slideIn .4s both}
.mitem:hover{border-color:var(--gold);background:#fff9ea;transform:translateY(-2px)}
.mitem span:last-child{white-space:nowrap}
.mitem .box{flex:0 0 36px;height:36px;border-radius:10px;border:3px solid #cdb8a2;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;transition:all .2s}
.mitem.done .box{background:var(--green);border-color:var(--green)}
.mitem.done{background:#eefaf3;border-color:#bfe7cf;text-decoration:line-through;color:#4d7a5f}
.mission .foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.mission .foot p{font-size:24px;font-weight:700;color:var(--brown)}
.mission .foot p b{color:var(--red)}

/* =========================================================
   엔딩
   ========================================================= */
.ending-wrap{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:50px;text-align:center}
.family{display:flex;gap:10px;animation:pop .6s both}
.family span{display:inline-block;width:78px;height:78px;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.18);background:#fff3df;animation:bounce 1.4s ease-in-out infinite}
.family span svg,.family span img{width:100%;height:100%;display:block}
.family span:nth-child(2n){animation-delay:.2s}.family span:nth-child(3n){animation-delay:.4s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.clear{font-family:var(--font-title);font-size:82px;color:#fff;text-shadow:0 6px 0 #b5423f,0 14px 30px rgba(80,20,10,.4);animation:pop .7s .2s cubic-bezier(.34,1.56,.64,1) both;letter-spacing:3px}
.result{display:flex;gap:24px;margin:10px 0 12px;animation:pop .6s .5s both}
.rbar{width:360px;background:rgba(255,255,255,.95);border-radius:20px;padding:12px 18px;box-shadow:0 8px 20px rgba(0,0,0,.15);text-align:left}
.rbar .lab{display:flex;justify-content:space-between;font-weight:900;font-size:20px;margin-bottom:8px}
.rbar .track{height:22px;background:#eadfd2;border-radius:999px;overflow:hidden}
.rbar .fill{height:100%;width:0;border-radius:999px;transition:width 1.4s cubic-bezier(.34,1.3,.64,1)}
.rbar.hyo .fill{background:linear-gradient(90deg,#ff7d7a,#e0524f)}
.rbar.word .fill{background:linear-gradient(90deg,#ffd76a,#f5a623)}
.rbar .stars{margin-top:6px;font-size:20px;letter-spacing:2px}
.ending-msg{font-size:22px;font-weight:700;color:#5b2e22;background:rgba(255,255,255,.85);padding:12px 28px;border-radius:20px;line-height:1.6;animation:pop .6s .8s both}
.final{
  font-family:var(--font-title);font-size:46px;color:#fff;margin-top:14px;padding:12px 36px;max-width:1180px;border-radius:24px;
  background:linear-gradient(90deg,#e0524f,#f0a52a);box-shadow:0 10px 0 #a83533,0 18px 30px rgba(0,0,0,.3);
  animation:pop .8s 1.1s cubic-bezier(.34,1.56,.64,1) both;letter-spacing:1px;
}
.ending-wrap .btns{margin-top:22px;display:flex;gap:16px;animation:pop .6s 1.5s both}

/* =========================================================
   반짝임 효과
   ========================================================= */
#fx{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.star{position:absolute;font-size:40px;animation:starburst 1.4s ease-out forwards}
@keyframes starburst{0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(220deg)}}
.flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,240,180,.7),rgba(255,240,180,0) 65%);animation:flash 1s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.sparkle{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px #ffe58a;animation:twinkle 1.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.2)}}

/* 세로 화면 안내 */
#rotate{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:100;display:none;white-space:nowrap}
@media (orientation:portrait){#rotate{display:block}}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="scene"></div>
    <div id="hud">
      <div class="logo">명절에 생긴 일</div>
      <div class="gauges">
        <div class="gauge hyo" id="g-hyo">
          <span class="lab">❤️ 효도</span>
          <div class="bar"><div class="fill"></div></div>
          <span class="num">0/5</span>
        </div>
        <div class="gauge word" id="g-word">
          <span class="lab">📖 말씀 지키기</span>
          <div class="bar"><div class="fill"></div></div>
          <span class="num">0/2</span>
        </div>
        <button class="sound" id="soundBtn" title="소리 설정">🔊</button>
      </div>
      <div class="sound-panel" id="soundPanel" hidden>
        <div class="srow">
          <label class="sw"><input type="checkbox" id="bgmOn" checked><span class="knob"></span></label>
          <span class="slab">🎵 배경음악</span>
          <input type="range" id="bgmVol" min="0" max="100" value="22">
          <span class="sval" id="bgmValTxt">22</span>
        </div>
        <div class="srow">
          <label class="sw"><input type="checkbox" id="sfxOn" checked><span class="knob"></span></label>
          <span class="slab">🔔 효과음</span>
          <input type="range" id="sfxVol" min="0" max="100" value="80">
          <span class="sval" id="sfxValTxt">80</span>
        </div>
      </div>
    </div>
    <div id="fx"></div>
  </div>
</div>
<div id="rotate">📱 기기를 가로로 돌리면 더 크게 볼 수 있어요</div>

/* =========================================================
   사운드 (효과음은 Web Audio로 합성, 배경음악은 파일)
   ========================================================= */
const Sound = {
  ctx: null, bgm: null, bgmGain: null, bgmStarted: false,
  bgmOn: true, sfxOn: true, bgmVol: AUDIO.bgmVolume, sfxVol: AUDIO.sfxVolume,
  init(){
    if(this.ctx) { if(this.ctx.state === 'suspended') this.ctx.resume(); this.playBgm(); return; }
    try{ this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ this.ctx = null; }
    this.loadBgm();
  },
  /* 배경음악: Web Audio 로 디코딩해 이음새 없이 반복. (file:// 등에서 fetch 가 막히면 <audio> 태그로 대체) */
  loadBgm(){
    if(!AUDIO.bgm || this.bgmStarted) return;
    this.bgmStarted = true;
    const fallback = () => {
      const el = new Audio(AUDIO.bgm); el.loop = true; el.volume = this.bgmVol;
      this.bgm = { el, play(){ el.play().catch(() => {}); }, pause(){ el.pause(); }, setVol(v){ el.volume = v; } };
      this.playBgm();
    };
    if(!this.ctx || !window.fetch){ fallback(); return; }
    fetch(AUDIO.bgm).then(r => r.arrayBuffer()).then(buf => new Promise((res, rej) => {
      const p = this.ctx.decodeAudioData(buf, res, rej); if(p && p.then) p.then(res, rej);
    })).then(buffer => {
      const gain = this.ctx.createGain(); gain.gain.value = 0; gain.connect(this.ctx.destination);
      const src = this.ctx.createBufferSource(); src.buffer = buffer; src.loop = true;
      const len = AUDIO.bgmLoopLength > 0 ? Math.min(AUDIO.bgmLoopLength, buffer.duration) : buffer.duration;
      const extra = buffer.duration - len;                 // mp3 인코더 여백 보정
      src.loopStart = Math.max(0, Math.min(extra, 0.026)); src.loopEnd = src.loopStart + len;
      src.connect(gain); src.start(0, src.loopStart);
      this.bgmGain = gain;
      this.bgm = {
        play: () => { const t = this.ctx.currentTime; gain.gain.cancelScheduledValues(t); gain.gain.setValueAtTime(gain.gain.value, t); gain.gain.linearRampToValueAtTime(this.bgmVol, t + 1.5); },
        pause: () => { const t = this.ctx.currentTime; gain.gain.cancelScheduledValues(t); gain.gain.setValueAtTime(gain.gain.value, t); gain.gain.linearRampToValueAtTime(0, t + 0.4); },
        setVol: (v) => { if(!this.bgmOn) return; const t = this.ctx.currentTime; gain.gain.cancelScheduledValues(t); gain.gain.setTargetAtTime(v, t, 0.05); },
      };
      this.playBgm();
    }).catch(fallback);
  },
  playBgm(){ if(this.bgm && this.bgmOn){ this.bgm.play(); } },
  tone(freq, dur, type = 'sine', vol = 1, delay = 0){
    if(!this.ctx || !this.sfxOn) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, this.sfxVol * vol), t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  click(){ this.tone(880, 0.08, 'triangle', .5); this.tone(1320, 0.06, 'sine', .25, 0.03); },   // 버튼 클릭: 짧은 '톡'
  pop(){ this.tone(520, 0.12, 'sine', .35); },                                                   // 말풍선 등장
  good(){ [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.35, 'triangle', .6, i * 0.09)); }, // 정답: 상승 아르페지오
  hmm(){ this.tone(392, 0.25, 'sine', .4); this.tone(330, 0.35, 'sine', .4, 0.18); },            // 아쉬운 선택: 부드러운 하강
  gauge(){ this.tone(1175, 0.18, 'sine', .45); this.tone(1568, 0.28, 'sine', .35, 0.08); },      // 게이지 상승: '띠링'
  clear(){ [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => this.tone(f, 0.5, 'triangle', .55, i * 0.1)); }, // 엔딩
  apply(){
    if(this.bgm){ this.bgmOn ? (this.bgm.setVol(this.bgmVol), this.bgm.play()) : this.bgm.pause(); }
    const b = document.getElementById('soundBtn');
    const anyOn = this.bgmOn || this.sfxOn;
    b.textContent = anyOn ? '🔊' : '🔇'; b.classList.toggle('off', !anyOn);
    document.getElementById('bgmOn').checked = this.bgmOn; document.getElementById('sfxOn').checked = this.sfxOn;
    document.getElementById('bgmVol').value = Math.round(this.bgmVol * 100); document.getElementById('bgmValTxt').textContent = Math.round(this.bgmVol * 100);
    document.getElementById('sfxVol').value = Math.round(this.sfxVol * 100); document.getElementById('sfxValTxt').textContent = Math.round(this.sfxVol * 100);
    document.querySelectorAll('.srow')[0].classList.toggle('off', !this.bgmOn);
    document.querySelectorAll('.srow')[1].classList.toggle('off', !this.sfxOn);
    try{ localStorage.setItem('seollal-sound', JSON.stringify({ bgmOn:this.bgmOn, sfxOn:this.sfxOn, bgmVol:this.bgmVol, sfxVol:this.sfxVol })); }catch(e){}
  }
};
try{ const sv = JSON.parse(localStorage.getItem('seollal-sound') || 'null'); if(sv){ Object.assign(Sound, { bgmOn: !!sv.bgmOn, sfxOn: !!sv.sfxOn, bgmVol: +sv.bgmVol, sfxVol: +sv.sfxVol }); } }catch(e){}
Sound.apply();

/* ○○ 자리에 주인공 이름을 넣는다. 받침 유무에 따라 '○○이/○○야' 를 자연스럽게 바꿔 준다. */
function hasBatchim(str){
  const code = str.charCodeAt(str.length - 1);
  if(code < 0xAC00 || code > 0xD7A3) return false;
  return (code - 0xAC00) % 28 !== 0;
}
function fmt(text){
  const n = state.name, b = n !== '○○' && hasBatchim(n);
  return text
    .replaceAll('○○이', n === '○○' ? '○○이' : (b ? n + '이' : n))
    .replaceAll('○○야', n === '○○' ? '○○야' : (b ? n + '아' : n + '야'))
    .replaceAll('○○', n);
}
function bubbleHTML(line){
  if(line.who === 'narr') return `<div class="bubble narr">${fmt(line.text)}</div>`;
  const side = line.who === 'hero' ? 'right' : 'left';
  const who = line.who === 'hero' ? state.name : CHARS[line.who].name;
  return `<div class="bubble ${side}"><span class="who">${who}</span>${fmt(line.text)}</div>`;
}
/* 말풍선을 순서대로 등장시킨다. 화면을 누르면 남은 대사를 바로 보여준다. */
function playDialogue(dialogEl, lines, onDone, gap = 1100){
  let idx = 0;
  const speakers = sceneEl.querySelectorAll('.char');
  function show(){
    if(idx >= lines.length){ speakers.forEach(c => c.classList.remove('speaking')); onDone && onDone(); return; }
    const line = lines[idx++];
    dialogEl.insertAdjacentHTML('beforeend', bubbleHTML(line)); Sound.pop();
    speakers.forEach(c => c.classList.toggle('speaking', c.dataset.key === line.who));
    if(idx < lines.length){ dialogTimers.push(setTimeout(show, gap)); }
    else { dialogTimers.push(setTimeout(show, 500)); }
  }
  dialogEl.onclick = () => {
    if(idx >= lines.length) return;
    dialogTimers.forEach(clearTimeout); dialogTimers = [];
    while(idx < lines.length){ dialogEl.insertAdjacentHTML('beforeend', bubbleHTML(lines[idx++])); }
    speakers.forEach(c => c.classList.remove('speaking'));
    onDone && onDone();
  };
  show();
}
function nextButton(label, onClick, cls = ''){
  const wrap = document.createElement('div'); wrap.className = 'actions';
  const b = document.createElement('button'); b.className = 'btn show ' + cls; b.textContent = label;
  b.onclick = onClick; wrap.appendChild(b); sceneEl.appendChild(wrap); return b;
}

function choiceCard({ question, choices, important = false, onPick }){
  const o = overlay(`<div class="qcard ${important ? 'important' : ''}">
      ${important ? '<div class="tag">중요한 선택</div>' : ''}
      <h2>${question}</h2>
      <div class="choices">
        ${choices.map((c, i) => `<button class="choice ${'abc'[i]}" data-i="${i}"><span class="key">${'ABC'[i]}</span><span>${fmt(c)}</span></button>`).join('')}
      </div></div>`, !important);
  o.querySelectorAll('.choice').forEach(btn => btn.onclick = () => { o.remove(); onPick(+btn.dataset.i); });
  return o;
}
/* 피드백 카드: kind = 'retry' | 'next' | 'good' */
function feedback({ title, text, quote, kind, gains = [], onRetry, onNext, nextLabel = '다음 ▶' }){
  const cls = kind === 'good' ? 'good' : 'hmm';
  const btns = [];
  if(onRetry) btns.push(`<button class="btn ghost" data-act="retry">↩ 다른 선택 해보기</button>`);
  if(onNext)  btns.push(`<button class="btn ${kind==='good' ? 'gold' : ''}" data-act="next">${nextLabel}</button>`);
  const o = overlay(`<div class="fcard ${cls}">
      <h2>${title}</h2>
      ${quote ? `<div class="quote">${fmt(quote)}</div>` : ''}
      <p>${fmt(text)}</p>
      ${gains.length ? `<div class="gain">${gains.map(g => `<span>${g}</span>`).join('')}</div>` : ''}
      <div class="btns">${btns.join('')}</div></div>`);
  if(kind === 'good'){ burst(); setTimeout(() => Sound.good(), 60); } else { setTimeout(() => Sound.hmm(), 60); }
  o.querySelector('[data-act="retry"]')?.addEventListener('click', () => { o.remove(); onRetry(); });
  o.querySelector('[data-act="next"]')?.addEventListener('click', () => { o.remove(); onNext(); });
  return o;
}

/* =========================================================
   9. 효도 미션 화면
   ========================================================= */
const MISSIONS = [
  '부모님께 먼저 인사드리기', '부모님 도와드리기', '어른들께 밝게 인사하기', '감사한 마음 표현하기',
  '세뱃돈을 받으면 감사하다고 말하기', '믿지 않는 가족을 위해 기도하기', '가족과 즐거운 시간 보내기',
];
const missionDone = new Set();
function sceneMission(from){
  state.missionFrom = from;
  sceneEl.innerHTML = bgHTML('after') + `
    <div class="mission-wrap"><div class="mission">
      <h2>🎁 이번 설날 효도 미션</h2>
      <div class="mlist">${MISSIONS.map((m, i) => `<button class="mitem ${missionDone.has(i)?'done':''}" data-i="${i}" style="animation-delay:${i*.08}s"><span class="box">${missionDone.has(i)?'✔':''}</span><span>${m}</span></button>`).join('')}</div>
      <div class="foot">
        <p>몇 개나 할 수 있을까요? &nbsp;<b id="mcount">${missionDone.size}</b> / 7</p>
        <button class="btn gold" id="missionBtn">${from === 'ending' ? '엔딩으로 돌아가기 ▶' : '미션 도전하기!'}</button>
      </div>
    </div></div>`;
  sceneEl.querySelectorAll('.mitem').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if(missionDone.has(i)) missionDone.delete(i); else missionDone.add(i);
    b.classList.toggle('done'); b.querySelector('.box').textContent = missionDone.has(i) ? '✔' : '';
    $('#mcount').textContent = missionDone.size;
    if(missionDone.size === 7) burst(30);
  });
  $('#missionBtn').onclick = () => goScene(sceneEnding);
}

/* =========================================================
   10. 엔딩
   ========================================================= */
function sceneEnding(){
  const hs = '★'.repeat(state.hyo) + '☆'.repeat(HYO_MAX - state.hyo);
  const ws = '★'.repeat(state.word) + '☆'.repeat(WORD_MAX - state.word);
  sceneEl.innerHTML = bgHTML('ending') + `
    <div class="ending-wrap">
      <div class="family">${['grandma','uncle','dad','mom','hero','relative'].map(k => `<span>${IMAGES.chars[k] ? `<img src="${IMAGES.chars[k]}" alt="">` : faceSVG(k)}</span>`).join('')}</div>
      <div class="clear">🎉 MISSION CLEAR!</div>
      <div class="result">
        <div class="rbar hyo"><div class="lab"><span>❤️ 효도 게이지</span><span>${state.hyo} / ${HYO_MAX}</span></div><div class="track"><div class="fill" id="rh"></div></div><div class="stars">${hs}</div></div>
        <div class="rbar word"><div class="lab"><span>📖 말씀 지키기 게이지</span><span>${state.word} / ${WORD_MAX}</span></div><div class="track"><div class="fill" id="rw"></div></div><div class="stars">${ws}</div></div>
      </div>
      <div class="ending-msg">제사에 참여하지 않는 것만이 전부가 아니에요.<br>하나님의 말씀을 지키면서 가족을 사랑하고 어른을 존중하는 모습을 보여 주세요.<br><span style="color:var(--red-dark)">하나님의 백성은 살아계신 부모님, 웃어른께 효도해야 해요</span></div>
      <div class="final">“하나님 말씀에 순종하여 명절에 효도하겠습니다!”</div>
      <div class="btns">
        <button class="btn" id="againBtn">🔄 다시 하기</button>
        <button class="btn gold" id="missionViewBtn">🎁 효도 미션 보기</button>
      </div>
    </div>`;
  setTimeout(() => {
    $('#rh').style.width = (state.hyo / HYO_MAX * 100) + '%';
    $('#rw').style.width = (state.word / WORD_MAX * 100) + '%';
  }, 700);
  setTimeout(() => { burst(34); Sound.clear(); }, 400);
  $('#againBtn').onclick = () => { missionDone.clear(); goScene(sceneTitle); };
  $('#missionViewBtn').onclick = () => goScene(sceneMission, 'ending');
}

/* 시작 */
renderGauges();
sceneTitle();
</script>
